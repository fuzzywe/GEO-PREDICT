<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/pedict.css">
    <title>Geo-PredictX</title>
    <style>
        .severity-indicator {
            font-size: 24px;
            font-weight: bold;
            transition: all 0.5s ease;
            text-align: center;
        }
        .low { color: green; }
        .moderate { color: orange; }
        .high { color: red; }
        .extreme { color: darkred; }
        .btn-animate:hover { transform: scale(1.1); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
          <a class="navbar-brand" href="home.html">Geo-PredictX</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link" href="news.html">Live-News</a>
              <a class="nav-link" href="https://disastermap.netlify.app/">Map</n>
              <a class="nav-link" href="https://cloudtrack.netlify.app/">Weather</a>
              <a class="nav-link" href="predict.html">Predict</a>
              <a class="nav-link" href="what.html">What to do?</a>
              <a class="nav-link" href="contact.html">Contact-Us</a>
            </div>
          </div>
        </div>
    </nav>

    <div class="background-image">  
        <div class="container">
            <h1>Disaster Severity Prediction</h1>
            <div class="row">
                <div class="col-md-6">
                    <label>Place: <input type="text" id="place" placeholder="Enter location"></label>
                    <label>Disaster Type:
                        <select id="disaster_type">
                            <option value="">Select Disaster Type</option>
                            <option value="Earthquake">Earthquake</option>
                            <option value="Flood">Flood</option>
                            <option value="Hurricane">Hurricane</option>
                            <option value="Tornado">Tornado</option>
                            <option value="Wildfire">Wildfire</option>
                            <option value="Landslide">Landslide</option>
                        </select>
                    </label>
                    <label>Previous Disasters Frequency: <input type="number" id="previous_disasters" placeholder="Times affected"></label>
                </div>
                <div class="col-md-6">
                    <label>Elevation (m): <input type="number" id="elevation" placeholder="Height above sea level" onfocus="showHelp('elevationHelp')"></label>
                    
                    <small id="elevationHelp" class="form-text text-muted" style="display:none;">Elevation affects the impact of disasters like floods and landslides.</small>
                    <label>Population Density (per km²): <input type="number" id="population_density" placeholder="People per km²" onfocus="showHelp('populationDensityHelp')"></label>
                    <small id="populationDensityHelp" class="form-text text-muted" style="display:none;">Higher population density means greater disaster impact.</small>
                    <label>Flooded Area (km²): <input type="number" id="flooded_area" placeholder="Extent of flooding" onfocus="showHelp('floodedAreaHelp')"></label>
                    <small id="floodedAreaHelp" class="form-text text-muted" style="display:none;">Flooded area affects severity predictions for floods.</small>
                </div>
            </div>
            <button onclick="predictSeverity()" class="btn btn-primary mt-3 btn-animate">Predict Severity</button>
            <h1 id="result" class="severity-indicator mt-3"></h1>
        </div>
    </div>

    <script>
        function showHelp(id) {
            document.getElementById(id).style.display = "block";
        }

        function getElevation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    fetch(`https://api.open-elevation.com/api/v1/lookup?locations=${lat},${lon}`)
                        .then(response => response.json())
                        .then(data => {
                            document.getElementById("elevation").value = data.results[0].elevation;
                        })
                        .catch(() => alert("Unable to fetch elevation data. Try again later."));
                }, () => alert("Geolocation access denied. Enter elevation manually."));
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }

        function predictSeverity() {
            let place = document.getElementById("place").value.trim();
            let disasterType = document.getElementById("disaster_type").value;
            let prevDisasters = parseInt(document.getElementById("previous_disasters").value) || 0;
            let elevation = parseInt(document.getElementById("elevation").value) || 0;
            let populationDensity = parseInt(document.getElementById("population_density").value) || 0;
            let floodedArea = parseInt(document.getElementById("flooded_area").value) || 0;

            if (!place || !disasterType) {
                document.getElementById("result").innerText = "❌ Please enter all required details!";
                document.getElementById("result").className = "severity-indicator text-danger";
                return;
            }

            let severityScore = (prevDisasters * 2) + (floodedArea * 1.5) + (populationDensity / 100) - (elevation / 50);

            let severity, className;
            if (severityScore > 100) {
                severity = "Extreme 🌪️🔥";
                className = "severity-indicator extreme";
            } else if (severityScore > 50) {
                severity = "High 🚨";
                className = "severity-indicator high";
            } else if (severityScore > 20) {
                severity = "Moderate ⚠️";
                className = "severity-indicator moderate";
            } else {
                severity = "Low ✅";
                className = "severity-indicator low";
            }

            let resultElement = document.getElementById("result");
            resultElement.innerText = `Predicted Severity: ${severity} (${Math.round(severityScore)})`;
            resultElement.className = className;
        }
    </script>
</body>
</html>
